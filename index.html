<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

    <div id="app-wrapper">
        <div id="controls">
            <!-- Preference Window -->
            <div class="control-card">
                <div class="card-header">
                    <h2 class="card-title">Preference</h2>
                </div>

                <div class="card-row preference-row">
                    <!-- Device Mode Toggle (Android / iOS) -->
                    <label class="toggle-pill" title="Toggle Android / iOS Mode">
                        <input type="checkbox" id="osToggle">
                        <span class="toggle-track">
                            <span class="toggle-knob">
                                <span class="knob-icon icon-android" title="Android Mode">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9992.4482.9992.9993s-.4482.9997-.9992.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993s-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5832 8.4116 13.8475 8.125 12 8.125c-1.8475 0-3.5832.2866-5.1368.8247L4.8409 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.7845h24c-.3432-4.1256-2.6889-7.5978-6.1185-9.4631" />
                                    </svg>
                                </span>
                                <span class="knob-icon icon-apple" title="iOS Mode">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.03-.49 2.65-1.24z" />
                                    </svg>
                                </span>
                            </span>
                        </span>
                    </label>

                    <!-- Theme Mode Toggle (Light / Dark) -->
                    <label class="toggle-pill" title="Toggle Light / Dark Theme">
                        <input type="checkbox" id="themeToggle">
                        <span class="toggle-track">
                            <span class="toggle-knob">
                                <span class="knob-icon icon-sun" title="Light Theme">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="5"></circle>
                                        <line x1="12" y1="1" x2="12" y2="3"></line>
                                        <line x1="12" y1="21" x2="12" y2="23"></line>
                                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                        <line x1="1" y1="12" x2="3" y2="12"></line>
                                        <line x1="21" y1="12" x2="23" y2="12"></line>
                                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                                    </svg>
                                </span>
                                <span class="knob-icon icon-moon" title="Dark Theme">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                    </svg>
                                </span>
                            </span>
                        </span>
                    </label>

                    <!-- Load Your File Pill Button -->
                    <button type="button" id="btnLoadFile" class="pill-btn primary-pill load-file-btn">
                        Load Your File
                    </button>
                    <input type="file" id="fileInput" accept=".txt" style="display: none;">
                </div>

                <!-- Hidden compatibility elements to support app.js references -->
                <span id="osLabel" class="visually-hidden">Android Mode</span>
                <span id="themeLabel" class="visually-hidden">Light Theme</span>
                <span id="fileNameDisplay" class="visually-hidden">Choose .txt file</span>
            </div>

            <!-- Wallpaper Customizer Window -->
            <div class="control-card">
                <div class="card-header">
                    <h2 class="card-title">Chat Wallpaper</h2>
                </div>

                <!-- 5 Static Colors + 1 Custom Color Box -->
                <div class="wallpaper-swatches-row" id="wallpaperPresets">
                    <button class="wp-swatch wp-preset" data-color="#1e7ec8" style="background-color: #1e7ec8;"
                        title="Royal Blue"></button>
                    <button class="wp-swatch wp-preset" data-color="#b07d4b" style="background-color: #b07d4b;"
                        title="Tan Brown"></button>
                    <button class="wp-swatch wp-preset" data-color="#38b449" style="background-color: #38b449;"
                        title="Emerald Green"></button>
                    <button class="wp-swatch wp-preset" data-color="#c62828" style="background-color: #c62828;"
                        title="Crimson Red"></button>
                    <button class="wp-swatch wp-preset" data-color="#686d74" style="background-color: #686d74;"
                        title="Slate Grey"></button>
                    <button class="wp-swatch wp-swatch-custom" id="customColorSwatch" title="Pick Custom Color">
                        <span class="figma-color-dots" aria-hidden="true">
                            <span class="cdot" style="background:#ff3b30;"></span>
                            <span class="cdot" style="background:#ff9500;"></span>
                            <span class="cdot" style="background:#ffcc00;"></span>
                            <span class="cdot" style="background:#34c759;"></span>
                            <span class="cdot" style="background:#00c7be;"></span>
                            <span class="cdot" style="background:#007aff;"></span>
                            <span class="cdot" style="background:#5856d6;"></span>
                            <span class="cdot" style="background:#af52de;"></span>
                            <span class="cdot" style="background:#ff2d55;"></span>
                        </span>
                        <input type="color" id="wpColorPicker" value="#efeae2"
                            style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;">
                    </button>
                </div>

                <!-- Hidden compatibility elements for color picker text & preview -->
                <span id="wpColorHex" class="visually-hidden">#efeae2</span>
                <div id="colorPickerPreview" class="visually-hidden"></div>

                <!-- Action Row: Custom Wallpaper Button, Doodle Toggle, Reset Button -->
                <div class="wallpaper-action-row">
                    <div class="wallpaper-left-group">
                        <button type="button" id="btnCustomWallpaper" class="pill-btn primary-pill custom-wp-btn">
                            Custom Wallpaper
                        </button>
                        <input type="file" id="wpImgUpload" accept="image/*" style="display: none;">

                        <!-- Doodle Pattern Toggle -->
                        <label class="toggle-pill toggle-pill-sm doodle-toggle-pill" title="Toggle Doodle Pattern">
                            <input type="checkbox" id="doodleToggle" checked>
                            <span class="toggle-track">
                                <span class="toggle-knob"></span>
                            </span>
                        </label>
                    </div>

                    <!-- Reset Button centered directly under the 6th color box -->
                    <div class="wallpaper-reset-wrapper">
                        <button type="button" id="btnResetWallpaper" class="circle-btn" title="Reset Default Wallpaper">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <polyline points="3 3 3 8 8 8"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Image preview box (hidden by default, shown if custom image uploaded) -->
                <div class="wp-img-preview-box" id="wpImgPreviewBox" style="display: none;">
                    <div class="wp-preview-inner">
                        <img class="wp-thumb" id="wpThumbImg" alt="Wallpaper Preview">
                        <span id="wpImgName">wallpaper.jpg</span>
                    </div>
                    <button id="btnRemoveWpImg" class="search-btn btn-icon-pad" title="Remove image wallpaper">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Search Window -->
            <div class="control-card">
                <div class="card-header">
                    <h2 class="card-title">Search</h2>
                </div>
                <div class="search-row">
                    <div class="search-pill-input">
                        <input type="text" id="searchInput" placeholder='Use "quotes" for exact' autocomplete="off"
                            spellcheck="false">
                        <button id="searchClear" class="search-clear-btn" title="Clear Search">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <span id="searchStats" class="search-stats-display">0/0</span>
                    <div class="search-arrows-group">
                        <button id="searchUp" class="search-arrow-btn" title="Previous Result">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="18 15 12 9 6 15"></polyline>
                            </svg>
                        </button>
                        <button id="searchDown" class="search-arrow-btn" title="Next Result">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Screenshot Window -->
            <div class="control-card screenshot-card">
                <div class="screenshot-row">
                    <button id="btnScreenshot" class="pill-btn primary-pill screenshot-action-btn">
                        Screenshot
                    </button>
                    <button id="toggleLowRes" class="low-res-toggle-btn" type="button" aria-pressed="false"
                        title="Low Resolution Screenshot">
                        <span class="low-res-knob"></span>
                        <span class="low-res-label">
                            <span class="low-res-text">Low Res</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <div class="device-container">
            <div class="device" id="mainDevice">
                <div id="loadingOverlay">
                    <div id="loadingText">Syncing Messages...</div>
                    <div class="progress-container">
                        <div id="progressBar"></div>
                    </div>
                </div>

                <div class="header">
                    <div class="header-left">
                        <button class="back-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <div class="profile-pic-container">
                            <div class="profile-pic" id="profilePic">?</div>
                        </div>
                        <div class="header-info">
                            <span class="header-name" id="uiRecipientName">Name</span>
                            <span class="header-status">tap here for contact info</span>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="action-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5">
                                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                            </svg></button>
                        <button class="action-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg></button>
                    </div>
                </div>

                <div class="chat-viewport" id="chatViewport">
                    <div class="chat-doodle-bg" id="chatDoodleBg"></div>
                    <div class="chat-container" id="chatContainer">
                        <div class="system-msg">Messages are end-to-end encrypted.</div>
                        <div class="system-msg upload-prompt">Please upload a WhatsApp exported .txt file to begin
                            viewing.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="contextMenu">
        <div class="menu-item" id="menuCopy">
            <span>Copy Text</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </div>
    </div>

    <div id="toast">Message text copied to clipboard</div>

    <input type="file" id="pfpUpload" accept="image/*">
    <script src="app.js"></script>
</body>

</html>
